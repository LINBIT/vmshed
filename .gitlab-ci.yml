image: docker.io/library/golang:1

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == 'master'

stages:
  - test
  - build
  - publish

test:
  stage: test
  cache:
    key:
      files:
      - go.sum
    paths:
      - .go/pkg/mod
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  script:
    - go version
    - go test -v -coverprofile .testCoverage.txt ./... 2>&1 | go run github.com/jstemmer/go-junit-report@latest -set-exit-code > test.xml
    - go tool cover -func=.testCoverage.txt
  artifacts:
    reports:
      junit: test.xml

integration-test:
  stage: test
  cache:
    key:
      files:
      - go.sum
    paths:
      - .go/pkg/mod
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  script:
    - make integration-test

build:
  stage: build
  cache:
    key:
      files:
      - go.sum
    paths:
      - .go/pkg/mod
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    # Static binary, same as the GitHub release build.
    CGO_ENABLED: "0"
  script:
    - make
  artifacts:
    paths:
      - vmshed
    expire_in: 1 week

publish:
  stage: publish
  image: $LINBIT_DOCKER_REGISTRY/build-helpers:latest
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
  needs:
    - build
  variables:
    # Only the build artifact is needed, skip the checkout.
    GIT_STRATEGY: none
    # The tag, or the branch name for branch and merge request pipelines.
    RELEASE_NAME: $CI_COMMIT_REF_NAME
  script:
    - . gitlab-utils.sh
    - ci_prepare_tools
    - pulp file content upload --repository tools --file vmshed --relative-path "vmshed/$RELEASE_NAME/vmshed-linux-amd64"
    - echo "Published $LINBIT_PULP_BASE_URL/pulp/content/file/tools/vmshed/$RELEASE_NAME/vmshed-linux-amd64"
